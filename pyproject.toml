[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-dr-palazzolo"
version = "1.1.0"
description = "Site officiel du Dr Jérôme Palazzolo"
authors = [
    {name = "Antoine Palazzolo", email = "palazzz99@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "black>=23.0.0,<25.0.0",
    "folium>=0.15.0,<1.0.0",
    "geopandas>=0.14.0,<1.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "urlchecker>=0.0.30,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | _site
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "_site",
    ".quarto",
]

